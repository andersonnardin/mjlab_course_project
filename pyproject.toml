[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project]
name = "customenv1-g1"
version = "0.1.0"
description = "MJLab custom G1 environments"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "mjlab>=1.1.1",
    "pygame>=2.6.1",
    "viser>=1.0.24",
]

[project.entry-points."mjlab.tasks"]
customenv1_g1 = "customenv1_g1"
atom01_mjlab = "atom01_mjlab"
